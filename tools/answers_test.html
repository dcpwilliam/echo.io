<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答案预测接口测试 · /api/answers/predict</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --ink: #1f2937; --muted: #6b7280;
    --line: #e5e7eb; --brand: #5B6CFF; --brand-soft: #eef0ff;
    --ok: #12b886; --warn: #E8590C; --red: #e03131;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.55; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 18px 20px; margin-bottom: 18px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  textarea, input[type=text], input[type=number] { width: 100%; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--ink);
    background: #fff; }
  textarea { resize: vertical; min-height: 64px; }
  .field { flex: 1; min-width: 200px; }
  .field.n { flex: 0 0 110px; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink);
    user-select: none; cursor: pointer; padding-bottom: 6px; }
  .switch input { width: 16px; height: 16px; accent-color: var(--brand); }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 10px;
    padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  button:hover { opacity: .9; }
  button:disabled { opacity: .55; cursor: progress; }
  .cfg { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px;
    padding-top: 14px; border-top: 1px dashed var(--line); }
  .cfg input { width: 260px; }
  .status { font-size: 12px; color: var(--muted); margin-top: 12px; min-height: 16px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: #fafbff; color: var(--muted); }
  .badge.provider { background: var(--brand-soft); color: var(--brand); border-color: #d9def8; }
  .badge.warn { background: #fff4e6; color: var(--warn); border-color: #ffd8a8; }
  .badge.ok { background: #e6fcf5; color: var(--ok); border-color: #b2f2e6; }
  .answer { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    background: #fff; }
  .answer .top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .rank { font-weight: 700; color: var(--brand); font-size: 15px; flex: 0 0 auto; }
  .ans-text { font-size: 15px; font-weight: 600; flex: 1; }
  .prob { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ok); font-size: 15px; flex: 0 0 auto; }
  .bar { height: 8px; background: #eef0f4; border-radius: 999px; overflow: hidden; margin: 4px 0 8px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #5B6CFF, #12b886); border-radius: 999px; }
  .reason { font-size: 13px; color: var(--muted); }
  pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 10px; overflow: auto;
    font-size: 12px; line-height: 1.5; max-height: 360px; }
  .err { color: var(--red); font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 6px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <h1>答案预测接口测试台</h1>
  <div class="sub">POST <code>/api/answers/predict</code> · 输入问题与答案数量 n，返回最可能的 n 个答案及各自成立概率（已归一化）</div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="q">问题 / 待预测事件</label>
        <textarea id="q" placeholder="例如：明天 A 股大盘会涨还是跌？">明天 A 股大盘会涨还是跌？</textarea>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="field n">
        <label for="n">答案数量 n (1–10)</label>
        <input id="n" type="number" min="1" max="10" value="3">
      </div>
      <label class="switch" title="勾选后才会真正调用大模型；不勾走本地规则占位">
        <input id="useLlm" type="checkbox">
        调用真实大模型 (use_llm)
      </label>
      <button id="go" style="margin-left:auto">预测</button>
    </div>

    <div class="cfg">
      <label style="margin:0">API 地址</label>
      <input id="base" type="text" value="http://127.0.0.1:8100">
      <span class="tip">接口已带 CORS，可直接跨域访问</span>
    </div>
    <div class="status" id="status">就绪。</div>
  </div>

  <div class="card">
    <div id="badges" class="badges" style="display:none"></div>
    <div id="results"></div>
    <details>
      <summary>查看原始 JSON 响应</summary>
      <pre id="raw">（尚未请求）</pre>
    </details>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const btn = $("go");

function setStatus(msg, isErr) {
  const s = $("status");
  s.textContent = msg;
  s.className = "status" + (isErr ? " err" : "");
}

function renderBadges(d) {
  const b = $("badges");
  b.style.display = "flex";
  b.innerHTML = "";
  const add = (txt, cls) => {
    const el = document.createElement("span");
    el.className = "badge " + (cls || "");
    el.textContent = txt;
    b.appendChild(el);
  };
  add("provider: " + (d.provider || "?"), "provider");
  add("source: " + (d.source || "?"), "");
  if (d.llmFallback) add("⚠ 已回落本地规则", "warn");
  else add("模型正常", "ok");
  add("归一化 sum=" + (d.totalProbability ?? 0).toFixed(2), "");
}

function renderResults(d) {
  const box = $("results");
  box.innerHTML = "";
  const list = (d.answers || []);
  if (!list.length) {
    box.innerHTML = '<div class="empty">没有返回任何答案。</div>';
    return;
  }
  const maxP = Math.max(...list.map(a => a.probability || 0), 0.0001);
  for (const a of list) {
    const p = a.probability || 0;
    const pct = (p * 100).toFixed(1) + "%";
    const width = (p / maxP * 100).toFixed(1) + "%";
    const div = document.createElement("div");
    div.className = "answer";
    div.innerHTML =
      '<div class="top">' +
        '<span class="rank">#' + (a.rank ?? "-") + '</span>' +
        '<span class="ans-text"></span>' +
        '<span class="prob">' + pct + '</span>' +
      '</div>' +
      '<div class="bar"><i style="width:' + width + '"></i></div>' +
      '<div class="reason"></div>';
    div.querySelector(".ans-text").textContent = a.answer || "(空)";
    div.querySelector(".reason").textContent = a.reason ? "依据：" + a.reason : "";
    box.appendChild(div);
  }
}

async function callApi() {
  const base = $("base").value.trim().replace(/\/+$/, "");
  const question = $("q").value.trim();
  const n = parseInt($("n").value, 10);
  const use_llm = $("useLlm").checked;

  if (!question) { setStatus("请先填写问题。", true); return; }
  if (!(n >= 1 && n <= 10)) { setStatus("n 必须是 1–10 之间的整数。", true); return; }

  btn.disabled = true;
  setStatus("请求中…");
  try {
    const resp = await fetch(base + "/api/answers/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, n, use_llm }),
    });
    const data = await resp.json();
    $("raw").textContent = JSON.stringify(data, null, 2);
    if (!resp.ok) {
      setStatus("HTTP " + resp.status + "：" + (data.detail || data.error || "未知错误"), true);
      $("badges").style.display = "none";
      $("results").innerHTML = "";
      return;
    }
    renderBadges(data);
    renderResults(data);
    setStatus("成功 · 返回 " + (data.answers || []).length + " 个答案。");
  } catch (e) {
    setStatus("请求失败：" + e.message + "（确认服务已启动且地址正确）", true);
    $("badges").style.display = "none";
    $("results").innerHTML = "";
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", callApi);
$("q").addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") callApi(); });
</script>
</body>
</html>
